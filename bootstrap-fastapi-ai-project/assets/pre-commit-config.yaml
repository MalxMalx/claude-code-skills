# Hooks run the tools from the project's own uv venv (language: system) rather than
# from pre-commit's isolated envs. This guarantees the hooks check exactly what
# `uv run ruff` / `uv run mypy` check locally.
#
# The isolated-env alternative (astral-sh/ruff-pre-commit + mirrors-mypy) requires
# restating every runtime dependency under `additional_dependencies`, and mirrors-mypy
# defaults to `--ignore-missing-imports`, so anything omitted silently degrades to Any.
# Under `strict = true` that surfaces as confusing errors like
# "Untyped decorator makes function ... untyped" on a correctly-typed FastAPI route.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (strict)
        # Whole-project check, matching `uv run mypy .`; per-file invocation gives
        # different results under strict mode depending on which files are staged.
        entry: uv run mypy .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
