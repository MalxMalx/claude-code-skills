# Append this block into pyproject.toml (created by `uv init`)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F",      # pycodestyle + pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "ASYNC",       # async-specific lints (catches blocking calls in async code)
    "RUF",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]   # lets `import app` resolve without installing the project as a package
